<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAN — Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>★</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --card: #0b0b0d;
    --card-2: #131316;
    --line: #2a2a30;
    --text: #fff;
    --muted: #9a9aa3;
    --danger: #ff6b6b;
    --ok: #7be0a1;
    --focus: #8ab4ff;
    --font: "Source Serif 4", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.5;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
  main { width: 100%; max-width: 1100px; margin: 0 auto; padding: 28px 24px 64px; flex: 1; }

  a { color: inherit; }
  h1, h2, h3 { line-height: 1.2; margin: 0; }
  h1 { font-size: 2.2rem; }
  h2 { font-size: 1.5rem; margin-bottom: 14px; }
  h3 { font-size: 1.1rem; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: .9rem; }

  /* ---------- header ---------- */
  header.top {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    max-width: 1100px; width: 100%; margin: 0 auto; padding: 22px 24px 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 1.7rem; font-weight: 700; letter-spacing: .12em; text-decoration: none; }
  .nav { display: flex; align-items: center; gap: 16px; }
  .nav a.link { color: var(--muted); text-decoration: none; font-weight: 600; }
  .nav a.link:hover { color: var(--text); }
  .user { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .user .ava { width: 34px; height: 34px; }

  /* ---------- buttons / inputs ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 20px; border-radius: 999px; border: 2px solid var(--text);
    background: var(--text); color: #000; font: inherit; font-size: .95rem; font-weight: 700;
    text-decoration: none; cursor: pointer; text-align: center;
  }
  .btn:hover { filter: brightness(.88); }
  .btn.ghost { background: transparent; color: var(--text); }
  .btn.ghost:hover { background: rgba(255,255,255,.1); filter: none; }
  .btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .btn.danger:hover { background: rgba(255,107,107,.12); filter: none; }
  .btn.sm { padding: 6px 14px; font-size: .85rem; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .tab:focus-visible, .drop:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 2px;
  }

  label.field { display: block; margin-bottom: 14px; }
  label.field > span { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text], input[type=url], select, textarea {
    width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: #050507; color: var(--text); font: inherit; font-size: .95rem;
  }
  textarea { min-height: 110px; resize: vertical; }
  input[type=color] { width: 54px; height: 40px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: #050507; cursor: pointer; }
  ::placeholder { color: #6b6b74; }

  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px;
  }
  .panel + .panel { margin-top: 20px; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .dashed { border: 1px dashed var(--line); border-radius: 14px; padding: 14px 18px; color: var(--muted); }

  /* ---------- login ---------- */
  .hero { text-align: center; padding: 8vh 0 0; }
  .hero .big-star { font-size: 3rem; }
  .hero h1 { font-size: clamp(3rem, 9vw, 5.5rem); letter-spacing: .14em; margin: 6px 0 12px; }
  .hero p.lead { max-width: 34ch; margin: 0 auto 28px; color: var(--muted); font-size: 1.15rem; }
  .login-box { max-width: 460px; margin: 0 auto; text-align: left; }
  .banner-error { border: 1px solid var(--danger); color: var(--danger); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; }

  /* ---------- server cards ---------- */
  .servers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 0; margin: 0; list-style: none; }
  .server-card { position: relative; display: flex; flex-direction: column; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .server-banner {
    position: relative; width: 100%; height: 76px; overflow: hidden;
    background:
      radial-gradient(1.6px 1.6px at 10% 28%, #fff, transparent 60%),
      radial-gradient(1px 1px at 22% 68%, #fff, transparent 60%),
      radial-gradient(1.4px 1.4px at 35% 20%, #fff, transparent 60%),
      radial-gradient(1px 1px at 47% 58%, #fff, transparent 60%),
      radial-gradient(1.8px 1.8px at 58% 30%, #fff, transparent 60%),
      radial-gradient(1px 1px at 68% 74%, #fff, transparent 60%),
      radial-gradient(1.4px 1.4px at 79% 22%, #fff, transparent 60%),
      radial-gradient(1px 1px at 88% 60%, #fff, transparent 60%),
      radial-gradient(1.2px 1.2px at 94% 34%, #fff, transparent 60%),
      linear-gradient(160deg, hsl(var(--hue, 260) 55% 16%), #000 90%);
  }
  .server-banner::after { content: "★"; position: absolute; left: 14px; top: 8px; font-size: 13px; opacity: .85; }
  .server-owner { position: absolute; top: 10px; right: 10px; padding: 3px 10px; border-radius: 999px; background: var(--text); color: #000; font-size: .75rem; font-weight: 700; line-height: 1.4; }
  .ava { flex: none; border-radius: 50%; background: hsl(var(--hue, 260) 45% 32%); display: grid; place-items: center; overflow: hidden; font-weight: 700; color: #fff; }
  .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .server-card .ava { width: 76px; height: 76px; margin-top: -38px; border: 4px solid var(--card); font-size: 1.7rem; position: relative; }
  .server-name {
    width: 100%; margin: 12px 0 2px; padding: 0 16px; text-align: center; font-size: 1.05rem; font-weight: 700; line-height: 1.3;
    min-height: 2.6em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
  }
  .server-meta { margin: 0 0 16px; font-size: .85rem; color: var(--muted); }
  .server-card .btn { width: calc(100% - 32px); margin: auto 16px 16px; }

  /* ---------- server page ---------- */
  .crumb { display: inline-block; margin-bottom: 10px; color: var(--muted); text-decoration: none; font-weight: 600; }
  .crumb:hover { color: var(--text); }
  .server-head { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  .server-head .ava { width: 64px; height: 64px; font-size: 1.5rem; }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 24px; overflow-x: auto; }
  .tab { padding: 10px 18px; color: var(--muted); text-decoration: none; font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--text); }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .stat b { display: block; font-size: 1.8rem; }
  .list { list-style: none; margin: 14px 0 0; padding: 0; }
  .list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .list li:first-child { border-top: 0; }
  .list .grow { min-width: 0; flex: 1; }
  .list .grow > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); padding: 10px 0 0; }

  .ar-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .ar-card .msg { color: var(--muted); font-size: .92rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .ar-trigger { font-weight: 700; overflow-wrap: anywhere; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font-size: .8rem; color: var(--muted); }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }

  /* ---------- modal ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.72); display: grid; place-items: center; padding: 16px; }
  .modal { width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow-y: auto; background: var(--card-2); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
  .modal h2 { margin-bottom: 4px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch i { position: absolute; inset: 0; border-radius: 999px; background: #3a3a42; transition: background .15s; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + i { background: #5b6cff; }
  .switch input:checked + i::after { transform: translateX(20px); }
  .switch input:focus-visible + i { outline: 3px solid var(--focus); outline-offset: 2px; }
  .drop { display: grid; place-items: center; gap: 4px; text-align: center; padding: 22px; border: 2px dashed var(--line); border-radius: 12px; cursor: pointer; margin-bottom: 14px; background: #050507; }
  .drop:hover { border-color: var(--muted); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .thumb { position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #050507; }
  .thumb img { display: block; width: 100%; height: 100px; object-fit: cover; }
  .thumb button { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.75); color: #fff; font-size: 16px; line-height: 1; cursor: pointer; }
  .thumb button:hover { background: #000; }
  .thumb button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* ---------- toasts ---------- */
  /* Top-right on purpose — bottom-right is where Netlify's own "Powered by Netlify"
     badge sits on the free tier, and it was covering these. */
  #toasts { position: fixed; right: 16px; top: 16px; z-index: 100; display: flex; flex-direction: column; gap: 10px; }
  .toast { background: var(--card-2); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 10px; padding: 10px 16px; max-width: 340px; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .toast.err { border-left-color: var(--danger); }

  footer { position: relative; z-index: 1; border-top: 1px solid var(--line); text-align: center; padding: 22px; color: var(--muted); font-size: .9rem; }

  /* ---------- custom cursor: white dot + trail of little stars ---------- */
  /* Only switched on (by JS) for mouse users, so touch screens and keyboard users keep normal behaviour. */
  html.has-cursor, html.has-cursor * { cursor: none !important; }
  #cursor-dot, #cursor-trail { position: fixed; pointer-events: none; mix-blend-mode: difference; /* stays visible over the white buttons */ }
  #cursor-trail { inset: 0; width: 100%; height: 100%; z-index: 9998; }
  #cursor-dot {
    top: 0; left: 0; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.75);
    z-index: 9999; opacity: 0; transition: opacity .15s, width .15s, height .15s, margin .15s;
  }
  #cursor-dot.on { opacity: 1; }
  #cursor-dot.big { width: 22px; height: 22px; margin: -11px 0 0 -11px; }

  @media (max-width: 560px) {
    header.top { flex-wrap: wrap; }
    .user span.name { display: none; }
    main { padding: 20px 16px 48px; }
  }

  /* ---------- styled server leaderboard preview ---------- */
  /* Locked to Noto Sans (same as fonts/YanSans.ttf on the bot host) — no font picker, so the preview always matches the real /leaderboard image. */
  .lb-wrap, .lb-me-card { font-family: 'Noto Sans', sans-serif; }
  .lb-wrap { border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,.15); }
  .lb-head { margin: 10px; padding: 12px 18px; border-radius: 16px; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 800; font-size: .95rem; letter-spacing: .03em; text-shadow: 0 1px 4px rgba(0,0,0,.85); }
  .lb-head img { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; }
  .lb-rows { margin: 0 10px 10px; }
  .lb-row { background: rgba(0,0,0,.45); }
  .lb-rows { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .lb-row {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 10px;
    background: rgba(0,0,0,.35); transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .lb-row:hover { transform: scale(1.035); box-shadow: 0 6px 22px rgba(0,0,0,.45); background: rgba(0,0,0,.55); z-index: 2; position: relative; }
  .lb-rank { width: 26px; flex-shrink: 0; text-align: center; font-weight: 800; opacity: .85; text-shadow: 0 1px 4px rgba(0,0,0,.85); }
  .lb-avatar { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; background-size: cover; background-position: center; border: 2px solid rgba(255,255,255,.5); }
  .lb-name-wrap { flex: 1; min-width: 0; }
  .lb-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 4px rgba(0,0,0,.85); }
  .lb-level { font-size: .78rem; opacity: .75; text-shadow: 0 1px 4px rgba(0,0,0,.85); }
  .lb-xp { flex-shrink: 0; font-weight: 800; text-align: right; text-shadow: 0 1px 4px rgba(0,0,0,.85); }
  .lb-me-card {
    border-radius: 14px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.15); text-align: center;
  }
  .lb-me-card .lb-avatar { width: 64px; height: 64px; }
  .lb-me-card .lb-name { font-size: 1.05rem; white-space: normal; }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<canvas id="cursor-trail" aria-hidden="true"></canvas>
<div id="cursor-dot" aria-hidden="true"></div>

<script>
/* =====================================================================
   CONFIG — the only two things you need to edit
   ===================================================================== */
const CONFIG = {
  // Your bot's fixed ngrok address (your free dev domain).
  API_DEFAULT: "https://italics-crisping-pluck.ngrok-free.dev",
  // Fetched automatically from web.js's DISCORD_CLIENT_ID env var right before the
  // page first renders (see the bottom of this file) — this placeholder is only
  // used if that fetch fails for some reason (e.g. the bot is offline).
  CLIENT_ID: "PUT_YOUR_DISCORD_CLIENT_ID_HERE",
};

const getApi = () => CONFIG.API_DEFAULT.replace(/\/+$/, "");

/* =====================================================================
   Tiny helpers
   ===================================================================== */
function h(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false && typeof n[k] !== "boolean") continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (typeof v === "boolean") n[k] = v;
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return n;
}
const $app = document.getElementById("app");

function toast(msg, isErr) {
  const t = h("div", { class: "toast" + (isErr ? " err" : "") }, msg);
  document.getElementById("toasts").append(t);
  setTimeout(() => t.remove(), 4200);
}

const ERRORS = {
  network: "Can't reach the bot. Check that it's running.",
  not_logged_in: "You're logged out. Log in again.",
  no_access: "You need the Manage Server permission in that server.",
  bot_not_in_guild: "The bot isn't in that server.",
  channel_not_found: "That channel doesn't exist. Pick one from the list.",
  member_not_found: "Couldn't find that member. Check the username, or that the bot's Server Members Intent is on.",
  missing_fields: "Fill in every field.",
  missing_trigger: "Enter a trigger.",
  empty_reply: "Add a message, an image or an embed.",
  too_many_autoreplies: "You've reached the limit of 50 auto replies.",
  too_many_embeds: "You've reached the limit of 25 embeds.",
  missing_name: "Give it a name.",
  invalid_image: "That image isn't supported. Use PNG, JPG, GIF or WEBP.",
  file_too_large: "That image is over 5MB.",
  unban_failed: "Couldn't unban. The bot needs the Ban Members permission.",
  autoreply_not_found: "That auto reply no longer exists.",
  oauth_failed: "Discord login failed. Try again.",
  empty_message: "Write a message or add a photo.",
  message_too_long: "That message is too long. Discord allows 2000 characters (4000 in an embed).",
  too_many_images: "You can send up to 4 photos at once.",
  total_too_large: "Those photos add up to more than 10MB. Remove one or use smaller files.",
  bot_missing_permission: "The bot can't post there. Give it View Channel, Send Messages, Attach Files and Embed Links in that channel.",
  send_failed: "Discord rejected the message. Check the bot's permissions in that channel.",
  missing_code: "Discord didn't return a login code. Try again.",
  missing_manage_messages: "The bot needs View Channel, Manage Messages and Read Message History in that channel.",
  purge_failed: "Couldn't delete those messages — they might be older than 14 days, which Discord won't let bots bulk-delete.",
  no_jail_role: "Pick and save a jail role first.",
  missing_manage_roles: "The bot needs the Manage Roles permission, and its own role must sit above the jail role and the member's other roles.",
};
const errText = (code) => ERRORS[code] || `Something went wrong (${code}).`;

class ApiError extends Error { constructor(code) { super(code); this.code = code; } }

async function api(path, { method = "GET", body } = {}) {
  let res;
  try {
    res = await fetch(getApi() + path, {
      method,
      credentials: "include",
      headers: {
        "ngrok-skip-browser-warning": "1",
        ...(body !== undefined ? { "Content-Type": "application/json" } : {}),
      },
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch { throw new ApiError("network"); }
  let data = null;
  try { data = await res.json(); } catch {}
  if (res.status === 401) throw new ApiError("not_logged_in");
  if (!res.ok) throw new ApiError(data?.error || "error_" + res.status);
  return data;
}

// run an action, toast on failure
async function attempt(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) {
    if (e.code === "not_logged_in") { location.hash = "#/login"; return; }
    toast(errText(e.code), true);
  }
}

function hueOf(id) { let n = 0; for (const c of String(id)) n = (n * 31 + c.charCodeAt(0)) % 360; return n; }

// "Add to server" link. With a guildId it pre-selects that server.
function inviteUrl(guildId) {
  return `https://discord.com/oauth2/authorize?client_id=${CONFIG.CLIENT_ID}&scope=bot%20applications.commands&permissions=8` +
    (guildId ? `&guild_id=${guildId}&disable_guild_select=true` : "");
}
function inviteButton(cls, label, guildId) {
  return h("a", {
    class: cls, href: inviteUrl(guildId), target: "_blank", rel: "noopener",
    onclick: (ev) => {
      if (CONFIG.CLIENT_ID.startsWith("PUT_")) { ev.preventDefault(); toast("Set CLIENT_ID at the top of index.html first.", true); }
    },
  }, label);
}
function initialOf(name) { const m = (name || "").match(/[\p{L}\p{N}]/u); return m ? m[0].toUpperCase() : "#"; }
function guildIcon(g, size = 128) {
  return g.icon ? `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.${g.icon.startsWith("a_") ? "gif" : "png"}?size=${size}` : null;
}
function userAvatar(u) {
  return u.avatar ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${u.avatar.startsWith("a_") ? "gif" : "png"}?size=64` : null;
}
function avatar(id, name, url, cls = "") {
  const box = h("div", { class: "ava " + cls, style: `--hue:${hueOf(id)}` });
  const letter = h("span", null, initialOf(name));
  if (url) {
    const img = h("img", { src: url, alt: "", loading: "lazy", referrerpolicy: "no-referrer" });
    img.onerror = () => { img.remove(); box.append(letter); };
    box.append(img);
  } else box.append(letter);
  return box;
}

/* =====================================================================
   Star field background
   ===================================================================== */
(function sky() {
  const c = document.getElementById("sky"), ctx = c.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stars = [], w = 0, h_ = 0;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h_ = innerHeight;
    c.width = w * dpr; c.height = h_ * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round((w * h_) / 9000);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * w, y: Math.random() * h_,
      r: Math.random() * 1.3 + .3, a: Math.random() * .6 + .25,
      s: Math.random() * .02 + .004, p: Math.random() * 6.28,
    }));
    draw(0);
  }
  function draw(t) {
    ctx.clearRect(0, 0, w, h_);
    for (const s of stars) {
      const tw = still ? 1 : .6 + .4 * Math.sin(t * s.s + s.p);
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!still) requestAnimationFrame(draw);
  }
  addEventListener("resize", () => { resize(); });
  resize();
  if (!still) requestAnimationFrame(draw);
})();

/* =====================================================================
   Custom cursor: white dot + trail of little stars
   ===================================================================== */
(function cursor() {
  // mouse users only; touch screens keep the normal behaviour
  if (!matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  const noTrail = matchMedia("(prefers-reduced-motion: reduce)").matches; // dot only, no moving stars
  const dot = document.getElementById("cursor-dot");
  const cv = document.getElementById("cursor-trail");
  const ctx = cv.getContext("2d");
  let w = 0, ht = 0;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; ht = innerHeight;
    cv.width = w * dpr; cv.height = ht * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  const MAX = 90, SPACING = 9; // one star roughly every 9px of movement
  const parts = [];
  let lx = null, ly = null, running = false, last = 0;

  function star(x, y, r, points, rot) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const a = rot + (i * Math.PI) / points - Math.PI / 2;
      const rad = i % 2 === 0 ? r : r * (points === 4 ? 0.36 : 0.45);
      ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fill();
  }

  function spawn(x, y) {
    if (parts.length >= MAX) parts.shift();
    parts.push({
      x: x + (Math.random() - .5) * 8, y: y + (Math.random() - .5) * 8,
      vx: (Math.random() - .5) * 14, vy: Math.random() * 16 + 4, // drifts gently downward
      r: Math.random() * 3.2 + 2.2, points: Math.random() < .6 ? 4 : 5,
      rot: Math.random() * 6.28, spin: (Math.random() - .5) * 2,
      life: 0, max: 520 + Math.random() * 380,
    });
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
  }

  function tick(now) {
    const dt = Math.min(now - last, 50); last = now;
    ctx.clearRect(0, 0, w, ht);
    ctx.fillStyle = "#fff";
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt;
      if (p.life >= p.max) { parts.splice(i, 1); continue; }
      const k = 1 - p.life / p.max; // 1 -> 0
      p.x += (p.vx * dt) / 1000; p.y += (p.vy * dt) / 1000; p.rot += (p.spin * dt) / 1000;
      ctx.globalAlpha = k * .9;
      star(p.x, p.y, p.r * (.4 + .6 * k), p.points, p.rot);
    }
    ctx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, w, ht); }
  }

  addEventListener("mousemove", (e) => {
    document.documentElement.classList.add("has-cursor"); // hide the arrow only once we know the dot works
    dot.classList.add("on");
    dot.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    if (noTrail) return;
    if (lx === null) { lx = e.clientX; ly = e.clientY; }
    // drop stars along the path so fast movement still leaves a continuous trail
    const dx = e.clientX - lx, dy = e.clientY - ly, dist = Math.hypot(dx, dy);
    if (dist >= SPACING) {
      const n = Math.min(Math.floor(dist / SPACING), 6);
      for (let i = 1; i <= n; i++) spawn(lx + (dx * i) / n, ly + (dy * i) / n);
      lx = e.clientX; ly = e.clientY;
    }
  }, { passive: true });

  // dot grows over things you can click
  addEventListener("mouseover", (e) => {
    const hit = e.target.closest?.("a, button, select, summary, [role=button], label.switch, input[type=checkbox], input[type=file], input[type=color]");
    dot.classList.toggle("big", !!hit);
  }, { passive: true });

  // hide when the mouse leaves the window
  document.addEventListener("mouseleave", () => { dot.classList.remove("on"); lx = ly = null; });
  document.addEventListener("mouseenter", () => dot.classList.add("on"));
})();

function header(user) {
  return h("header", { class: "top" },
    h("a", { class: "brand", href: "#/dashboard" }, "★ YAN"),
    user && h("nav", { class: "nav" },
      h("a", { class: "link", href: "#/dashboard" }, "Dashboard"),
      inviteButton("btn ghost sm", "+ Add to server"),
      h("div", { class: "user" },
        avatar(user.id, user.username, userAvatar(user)),
        h("span", { class: "name" }, user.username)),
      h("button", { class: "btn ghost sm", type: "button", onclick: logout }, "Logout")));
}
const footer = () => h("footer", null, "© YAN · Not affiliated with Discord Inc.");

function shell(user, ...content) {
  $app.replaceChildren(header(user), h("main", null, ...content), footer());
}

async function logout() {
  await attempt(() => api("/auth/logout", { method: "POST" }));
  location.hash = "#/login";
}

    header(null),
    h("main", null,
      h("div", { class: "hero" },

        h("h1", null, "YAN"),
        h("p", { class: "lead" }, "Manage your Discord servers, warnings and auto replies from one place."),

        h("div", { style: "margin-top:16px" }, inviteButton("btn ghost", "+ Add YAN to a server")))),

}

/* ---------- Dashboard: servers menu ---------- */
async function viewDashboard() {
  shell(null, h("p", { class: "muted" }, "Loading your servers…"));
  let user, guilds;
  try { [user, guilds] = await Promise.all([api("/api/me"), api("/api/guilds")]); }
  catch (e) { return failView(e); }

  const grid = h("ul", { class: "servers-grid" });
  for (const g of guilds) {
    const iconUrl = guildIcon(g);
    const card = h("li", { class: "server-card", style: `--hue:${hueOf(g.id)}` },
      h("div", { class: "server-banner" }, g.owner && h("span", { class: "server-owner" }, "Owner")),
      avatar(g.id, g.name, iconUrl),
      h("h3", { class: "server-name", title: g.name }, g.name),
      h("p", { class: "server-meta" }, g.bot ? `${g.members ?? "?"} members` : "Bot not added"),
      g.bot
        ? h("a", { class: "btn", href: `#/server/${g.id}` }, "Manage")
        : inviteButton("btn ghost", "Invite", g.id));
    grid.append(card);
  }

  shell(user,
    h("div", { class: "row between", style: "margin-bottom:22px; align-items:flex-end" },
      h("div", null,
        h("h1", { style: "margin-bottom:6px" }, "Your servers"),
        h("p", { class: "muted" }, "Servers where you can manage things. Pick one to open its settings.")),
      inviteButton("btn", "+ Add YAN to a server")),
    guilds.length ? grid : h("div", { class: "dashed" }, "No servers found. You need the Manage Server permission in a server to see it here."));
}

function failView(e) {
  if (e.code === "not_logged_in") { location.hash = "#/login"; return; }
  shell(null,
    h("div", { class: "panel" },
      h("h2", null, "Something went wrong"),
      h("p", { class: "muted", style: "margin-bottom:16px" }, errText(e.code)),
      h("div", { class: "row" },
        h("button", { class: "btn", type: "button", onclick: () => route() }, "Try again"),
        h("a", { class: "btn ghost", href: "#/login" }, "Back to login"))));
}

/* ---------- Server page ---------- */
const TABS = [["overview", "Overview"], ["say", "Send message"], ["moderation", "Moderation"], ["autoreply", "Auto reply"], ["welcome", "Welcome"], ["leveling", "Leveling"], ["verify", "Verification"], ["whitelist", "Whitelist"]];

async function viewServer(id, tab = "overview") {
  shell(null, h("p", { class: "muted" }, "Loading server…"));
  let user, data;
  try { [user, data] = await Promise.all([api("/api/me"), api(`/api/guilds/${id}`)]); }
  catch (e) { return failView(e); }

  const body = h("div");
  shell(user,
    h("a", { class: "crumb", href: "#/dashboard" }, "← All servers"),
    h("div", { class: "server-head" },
      avatar(id, data.name, guildIcon({ id, icon: data.icon })),
      h("div", null, h("h1", null, data.name), h("p", { class: "muted" }, `${data.members} members`))),
    h("nav", { class: "tabs", "aria-label": "Server sections" },
      TABS.map(([key, label]) =>
        h("a", { class: "tab" + (key === tab ? " active" : ""), href: `#/server/${id}/${key}`, "aria-current": key === tab ? "page" : null }, label))),
    body);

  const refresh = () => viewServer(id, tab);
  if (tab === "overview") renderOverview(body, id, data, refresh);
  else if (tab === "say") renderSay(body, id, data);
  else if (tab === "moderation") await renderModeration(body, id, data, refresh);
  else if (tab === "autoreply") await renderAutoReply(body, id);
  else if (tab === "welcome") await renderWelcome(body, id, data);
  else if (tab === "leveling") await renderLeveling(body, id, data);
  else if (tab === "verify") await renderVerification(body, id, data);
  else if (tab === "whitelist") await renderWhitelist(body, id, data);
}

function channelSelect(names, current, noneLabel) {
  const sel = h("select", null, h("option", { value: "" }, noneLabel), names.map((n) => h("option", { value: n }, n)));
  sel.value = names.includes(current) ? current : "";
  return sel;
}
function roleSelect(roles, current, noneLabel) {
  const sel = h("select", null, h("option", { value: "" }, noneLabel), roles.map((r) => h("option", { value: r.id }, r.name)));
  sel.value = roles.some((r) => r.id === current) ? current : "";
  return sel;
}

function renderOverview(body, id, d, refresh) {
  const logSel = channelSelect(d.text, d.log, "No log channel");
  const vcSel = channelSelect(d.voice, d.vc, "Pick a voice channel");
  body.append(
    h("div", { class: "stat-row" },
      h("div", { class: "stat" }, h("b", null, d.members), "members"),
      h("div", { class: "stat" }, h("b", null, d.text.length), "text channels"),
      h("div", { class: "stat" }, h("b", null, d.voice.length), "voice channels"),
      h("div", { class: "stat" }, h("b", null, d.warns.length), "members warned")),
    h("div", { class: "grid-2" },
      h("div", { class: "panel" },
        h("h2", null, "Log channel"),
        h("p", { class: "muted small", style: "margin-bottom:14px" }, "Where the bot posts moderation logs."),
        h("label", { class: "field" }, h("span", null, "Channel"), logSel),
        h("button", { class: "btn", type: "button", onclick: async () => {
          await attempt(() => api(`/api/guilds/${id}/log`, { method: "POST", body: { channel: logSel.value } }), "Log channel saved");
        } }, "Save log channel")),
      h("div", { class: "panel" },
        h("h2", null, "Voice channel"),
        h("p", { class: "muted small", style: "margin-bottom:14px" },
          d.vc ? `The bot stays in ${d.vc}.` : "The bot isn't sitting in a voice channel."),
        h("label", { class: "field" }, h("span", null, "Channel"), vcSel),
        h("div", { class: "row" },
          h("button", { class: "btn", type: "button", onclick: async () => {
            if (!vcSel.value) return toast("Pick a voice channel first.", true);
            if (await attempt(() => api(`/api/guilds/${id}/voice/join`, { method: "POST", body: { channel: vcSel.value } }), "Joining voice channel")) refresh();
          } }, "Join"),
          h("button", { class: "btn ghost", type: "button", onclick: async () => {
            if (await attempt(() => api(`/api/guilds/${id}/voice/leave`, { method: "POST", body: {} }), "Left voice channel")) refresh();
          } }, "Leave")))));
}

function imageSlot({ hasExisting, onFile }) {
  const fileInput = h("input", { type: "file", accept: "image/png,image/jpeg,image/gif,image/webp", hidden: true });
  const box = h("div");
  let value; // undefined = keep, null = remove, dataUrl = replace
  let has = hasExisting;
  const draw = () => {
    let content;
    if (typeof value === "string") {
      content = h("div", { class: "toggle-row" }, h("span", null, "New GIF/image ready to upload"),
        h("button", { class: "btn ghost sm", type: "button", onclick: () => { value = undefined; draw(); } }, "Remove"));
    } else if (has && value !== null) {
      content = h("div", { class: "toggle-row" }, h("span", null, "Sending a GIF/image with this DM"),
        h("button", { class: "btn danger sm", type: "button", onclick: () => { value = null; draw(); } }, "Remove image"));
    } else {
      content = h("div", { class: "drop", tabindex: "0", role: "button", onclick: () => fileInput.click(),
        onkeydown: (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fileInput.click(); } } },
        h("strong", null, "Click to add a GIF or image"), h("span", { class: "muted small" }, "PNG, JPG, GIF or WEBP · maximum 5MB"));
    }
    box.replaceChildren(content);
  };
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    fileInput.value = "";
    if (!f) return;
    if (!/^image\/(png|jpe?g|gif|webp)$/.test(f.type)) return toast(errText("invalid_image"), true);
    if (f.size > 5 * 1024 * 1024) return toast(errText("file_too_large"), true);
    const fr = new FileReader();
    fr.onload = () => { value = fr.result; draw(); onFile?.(); };
    fr.readAsDataURL(f);
  });
  draw();
  return { box, fileInput, get value() { return value; } };
}

// Same "keep / remove / replace" upload pattern as imageSlot, worded for full backgrounds
// (welcome image, leaderboard image, profile card) instead of small DM attachments.
function backgroundSlot({ hasExisting, hint, onPreview, existingDataUrl }) {
  const fileInput = h("input", { type: "file", accept: "image/png,image/jpeg,image/gif,image/webp", hidden: true });
  const box = h("div");
  let value; // undefined = keep, null = remove, dataUrl = replace
  let has = hasExisting;
  const draw = () => {
    let content;
    if (typeof value === "string") {
      content = h("div", { class: "toggle-row" }, h("span", null, "New background ready to upload"),
        h("button", { class: "btn ghost sm", type: "button", onclick: () => { value = undefined; draw(); onPreview?.(existingDataUrl ?? null); } }, "Remove"));
    } else if (has && value !== null) {
      content = h("div", { class: "toggle-row" }, h("span", null, "Using a custom background"),
        h("button", { class: "btn danger sm", type: "button", onclick: () => { value = null; draw(); onPreview?.(null); } }, "Remove background"));
    } else {
      content = h("div", { class: "drop", tabindex: "0", role: "button", onclick: () => fileInput.click(),
        onkeydown: (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fileInput.click(); } } },
        h("strong", null, "Click to upload a background"),
        h("span", { class: "muted small" }, hint || "PNG, JPG, GIF or WEBP · maximum 5MB · falls back to a starfield if skipped"));
    }
    box.replaceChildren(content);
  };
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    fileInput.value = "";
    if (!f) return;
    if (!/^image\/(png|jpe?g|gif|webp)$/.test(f.type)) return toast(errText("invalid_image"), true);
    if (f.size > 5 * 1024 * 1024) return toast(errText("file_too_large"), true);
    const fr = new FileReader();
    fr.onload = () => { value = fr.result; draw(); onPreview?.(fr.result); };
    fr.readAsDataURL(f);
  });
  draw();
  return { box, fileInput, get value() { return value; } };
}

async function renderModeration(body, id, d, refresh) {
  let jail, modMsg;
  try { [jail, modMsg] = await Promise.all([api(`/api/guilds/${id}/jail`), api(`/api/guilds/${id}/mod-messages`)]); }
  catch (e) { return failView(e); }

  const user = h("input", { type: "text", placeholder: "Username or @name", maxlength: "64" });
  const reason = h("input", { type: "text", placeholder: "Reason", maxlength: "300" });

  const warnDmMessage = h("textarea", { placeholder: "You've been warned in {server}.\nReason: {reason}\nWarned by: {mod}", maxlength: "1500", style: "min-height:90px" });
  warnDmMessage.value = modMsg.warn.message || "";
  const warnImg = imageSlot({ hasExisting: modMsg.warn.hasImage });
  const saveWarnDm = h("button", { class: "btn ghost sm", type: "button" }, "Save warn DM");
  saveWarnDm.onclick = async () => {
    const payload = { message: warnDmMessage.value };
    if (warnImg.value !== undefined) payload.image = warnImg.value;
    await attempt(() => api(`/api/guilds/${id}/mod-messages/warn`, { method: "POST", body: payload }), "Warn DM saved");
  };

  const jailDmMessage = h("textarea", { placeholder: "You've been jailed in {server}.", maxlength: "1500", style: "min-height:70px" });
  jailDmMessage.value = modMsg.jail.message || "";
  const jailImg = imageSlot({ hasExisting: modMsg.jail.hasImage });
  const saveJailDm = h("button", { class: "btn ghost sm", type: "button" }, "Save jail DM");
  saveJailDm.onclick = async () => {
    const payload = { message: jailDmMessage.value };
    if (jailImg.value !== undefined) payload.image = jailImg.value;
    await attempt(() => api(`/api/guilds/${id}/mod-messages/jail`, { method: "POST", body: payload }), "Jail DM saved");
  };

  const purgeChan = h("select", null, h("option", { value: "" }, "Select a channel"), d.text.map((n) => h("option", { value: n }, "#" + n)));
  const purgeAmount = h("input", { type: "text", inputmode: "numeric", placeholder: "Amount (1-100)", maxlength: "3" });
  const purgeBtn = h("button", { class: "btn", type: "button" }, "Clear messages");
  purgeBtn.onclick = async () => {
    if (!purgeChan.value) return toast("Pick a channel first.", true);
    const n = parseInt(purgeAmount.value, 10);
    if (!n || n < 1) return toast("Enter how many messages to clear (1-100).", true);
    if (!confirm(`Delete the latest ${n} message${n === 1 ? "" : "s"} in #${purgeChan.value}? This can't be undone.`)) return;
    purgeBtn.disabled = true;
    const r = await attempt(() => api(`/api/guilds/${id}/purge`, { method: "POST", body: { channel: purgeChan.value, amount: n } }));
    purgeBtn.disabled = false;
    if (r) toast(`Deleted ${r.deleted} message${r.deleted === 1 ? "" : "s"} in #${purgeChan.value}`);
  };

  const jailRoleSel = roleSelect(d.roles || [], jail.roleId, "Select the jail role");
  const saveJailRole = h("button", { class: "btn ghost sm", type: "button" }, "Save jail role");
  saveJailRole.onclick = async () => {
    await attempt(() => api(`/api/guilds/${id}/jail/role`, { method: "POST", body: { role: jailRoleSel.value } }), "Jail role saved");
  };
  const jailUser = h("input", { type: "text", placeholder: "Username or @name", maxlength: "64" });
  const jailBtn = h("button", { class: "btn danger", type: "button" }, "Jail member");
  jailBtn.onclick = async () => {
    if (!jailRoleSel.value) return toast(errText("no_jail_role"), true);
    if (!jailUser.value.trim()) return toast(errText("missing_fields"), true);
    if (!confirm(`Strip ${jailUser.value.trim()}'s roles and jail them?`)) return;
    jailBtn.disabled = true;
    if (await attempt(() => api(`/api/guilds/${id}/jail`, { method: "POST", body: { username: jailUser.value.trim() } }), "Member jailed")) refresh();
    jailBtn.disabled = false;
  };

  body.append(
    h("div", { class: "grid-2" },
      h("div", { class: "panel" },
        h("h2", null, "Clear messages"),
        h("p", { class: "muted small", style: "margin-bottom:14px" }, "Deletes the most recent messages in a channel. Discord won't let bots bulk-delete anything older than 14 days."),
        h("label", { class: "field" }, h("span", null, "Channel"), purgeChan),
        h("label", { class: "field" }, h("span", null, "How many (1-100)"), purgeAmount),
        purgeBtn),
      h("div", { class: "panel" },
        h("h2", null, "Jail"),
        h("p", { class: "muted small", style: "margin-bottom:14px" }, "Jailing strips a member down to just the jail role. Unjailing restores whatever roles they had before."),
        h("label", { class: "field" }, h("span", null, "Jail role"), jailRoleSel),
        saveJailRole,
        h("h3", { style: "margin-top:20px" }, "DM when jailed"),
        h("p", { class: "muted small", style: "margin-bottom:10px" }, "Sent to the member right after they're jailed. Use {server} in the text."),
        h("label", { class: "field" }, h("span", null, "Message"), jailDmMessage),
        h("div", { class: "field" }, h("span", { style: "display:block;font-weight:600;margin-bottom:6px" }, "GIF / image"), jailImg.box, jailImg.fileInput),
        saveJailDm,
        h("h3", { style: "margin-top:20px" }, "Jail a member"),
        h("label", { class: "field", style: "margin-top:10px" }, h("span", null, "Member"), jailUser),
        jailBtn)),
    h("div", { class: "grid-2", style: "margin-top:20px" },
      h("div", { class: "panel" },
        h("h2", null, "Warn a member"),
        h("h3", null, "DM when warned"),
        h("p", { class: "muted small", style: "margin-bottom:10px" }, "Sent to the member right after they're warned. Use {reason}, {mod} and {server} in the text."),
        h("label", { class: "field" }, h("span", null, "Message"), warnDmMessage),
        h("div", { class: "field" }, h("span", { style: "display:block;font-weight:600;margin-bottom:6px" }, "GIF / image"), warnImg.box, warnImg.fileInput),
        saveWarnDm,
        h("h3", { style: "margin-top:20px" }, "Send a warning"),
        h("label", { class: "field", style: "margin-top:10px" }, h("span", null, "Member"), user),
        h("label", { class: "field" }, h("span", null, "Reason"), reason),
        h("button", { class: "btn", type: "button", onclick: async () => {
          if (!user.value.trim() || !reason.value.trim()) return toast(errText("missing_fields"), true);

/* ---------- Send message (text + photos to a channel) ---------- */
function renderSay(body, id, d) {
  const MAX_IMAGES = 4;
  const chan = h("select", null, h("option", { value: "" }, "Select a channel"), d.text.map((n) => h("option", { value: n }, "#" + n)));
  const message = h("textarea", { placeholder: "Write your message…", maxlength: "4000", style: "min-height:140px" });
  const asEmbed = h("input", { type: "checkbox" });
  const title = h("input", { type: "text", placeholder: "Embed title (optional)", maxlength: "256" });
  const color = h("input", { type: "color", value: "#5865f2" });
  const embedFields = h("div", { hidden: true },
    h("label", { class: "field" }, h("span", null, "Title"), title),
    h("div", { class: "row", style: "margin-bottom:14px" }, h("span", { style: "font-weight:600" }, "Colour"), color));
  asEmbed.addEventListener("change", () => { embedFields.hidden = !asEmbed.checked; });

  let images = []; // [{ dataUrl, size }]
  const fileInput = h("input", { type: "file", accept: "image/png,image/jpeg,image/gif,image/webp", multiple: true, hidden: true });
  const imgBox = h("div");
  const drawImages = () => {
    const parts = [];
    if (images.length) {
      parts.push(h("div", { class: "thumbs" }, images.map((im, i) =>
        h("div", { class: "thumb" },
          h("img", { src: im.dataUrl, alt: `Photo ${i + 1}` }),
          h("button", { type: "button", "aria-label": `Remove photo ${i + 1}`, onclick: () => { images.splice(i, 1); drawImages(); } }, "×")))));
    }
    if (images.length < MAX_IMAGES) {
      parts.push(h("div", { class: "drop", tabindex: "0", role: "button", onclick: () => fileInput.click(),
        onkeydown: (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fileInput.click(); } } },
        h("strong", null, images.length ? "Add another photo" : "Click to upload photos"),
        h("span", { class: "muted small" }, `Up to ${MAX_IMAGES} photos · PNG, JPG, GIF or WEBP · 5MB each`)));
    }
    imgBox.replaceChildren(...parts);
  };
  fileInput.addEventListener("change", async () => {
    const picked = [...fileInput.files].slice(0, MAX_IMAGES - images.length);
    fileInput.value = "";
    for (const f of picked) {
      if (!/^image\/(png|jpe?g|gif|webp)$/.test(f.type)) { toast(errText("invalid_image"), true); continue; }
      if (f.size > 5 * 1024 * 1024) { toast(`${f.name}: ${errText("file_too_large")}`, true); continue; }
      const dataUrl = await new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(f); });
      images.push({ dataUrl, size: f.size });
    }
    if (images.reduce((s, i) => s + i.size, 0) > 10 * 1024 * 1024) toast(errText("total_too_large"), true);
    drawImages();
  });
  drawImages();

  const send = h("button", { class: "btn", type: "button" }, "Send message");
  send.onclick = async () => {
    if (!chan.value) return toast("Pick a channel first.", true);
    if (!message.value.trim() && !images.length) return toast(errText("empty_message"), true);
    send.disabled = true;
    const ok = await attempt(() => api(`/api/guilds/${id}/say`, { method: "POST", body: {
      channel: chan.value,
      message: message.value,
      images: images.map((i) => i.dataUrl),
      asEmbed: asEmbed.checked,
      title: title.value,
      color: color.value,
    } }), `Message sent to #${chan.value}`);
    send.disabled = false;
    if (ok) { message.value = ""; title.value = ""; images = []; drawImages(); }
  };

  body.append(h("div", { class: "panel", style: "max-width:720px" },
    h("h2", null, "Send a message"),
    h("p", { class: "muted small", style: "margin-bottom:16px" },
      "The bot posts this in the channel you pick. Mentions like @everyone won't ping from here."),
    h("label", { class: "field" }, h("span", null, "Channel"), chan),
    h("label", { class: "field" }, h("span", null, "Message"), message),
    h("div", { class: "field" }, h("span", { style: "display:block;font-weight:600;margin-bottom:6px" }, "Photos"), imgBox, fileInput),
    h("div", { class: "toggle-row" },
      h("div", null, h("div", { style: "font-weight:600" }, "Send as embed"), h("div", { class: "muted small" }, "Shows the text in an embed, with your first photo inside it")),
      h("label", { class: "switch" }, asEmbed, h("i"))),
    embedFields,
    send));
}

function openAutoReplyModal(id, embeds, existing, done) {
  const editing = !!existing;
  const trigger = h("input", { type: "text", placeholder: "Enter the trigger word or phrase…", maxlength: "200", value: existing?.trigger || "" });
  const message = h("textarea", { placeholder: "Enter the reply message… ({user} and {server} work here)", maxlength: "2000" });
  message.value = existing?.message || "";
  const mention = h("input", { type: "checkbox", checked: !!existing?.mention, id: "ar-mention" });
  const match = h("select", null, h("option", { value: "contains" }, "Contains the trigger"), h("option", { value: "exact" }, "Exactly the trigger"));
  match.value = existing?.match === "exact" ? "exact" : "contains";
  const embedSel = h("select", null, h("option", { value: "" }, "Select an embed (optional)"), embeds.map((e) => h("option", { value: e.id }, e.name)));
  embedSel.value = existing?.embedId && embeds.some((e) => e.id === existing.embedId) ? existing.embedId : "";

  // attachment: undefined = keep, null = remove, string = new data URL
  let attachment = undefined;
  let hasCurrent = !!existing?.hasAttachment;
  const fileInput = h("input", { type: "file", accept: "image/png,image/jpeg,image/gif,image/webp", hidden: true });
  const attachBox = h("div");
  const drawAttach = () => {
    let content;
    if (typeof attachment === "string") {
      content = h("div", { class: "toggle-row" }, h("span", null, "New image ready to upload"),
        h("button", { class: "btn ghost sm", type: "button", onclick: () => { attachment = undefined; drawAttach(); } }, "Remove"));
    } else if (hasCurrent && attachment !== null) {
      content = h("div", { class: "toggle-row" }, h("span", null, "This auto reply has an image"),
        h("button", { class: "btn danger sm", type: "button", onclick: () => { attachment = null; drawAttach(); } }, "Remove image"));
    } else {
      content = h("div", { class: "drop", tabindex: "0", role: "button", onclick: () => fileInput.click(),
        onkeydown: (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fileInput.click(); } } },
        h("strong", null, "Click to upload image"), h("span", { class: "muted small" }, "PNG, JPG, GIF or WEBP · maximum 5MB"));
    }
    attachBox.replaceChildren(content);
  };
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    fileInput.value = "";
    if (!f) return;
    if (!/^image\/(png|jpe?g|gif|webp)$/.test(f.type)) return toast(errText("invalid_image"), true);
    if (f.size > 5 * 1024 * 1024) return toast(errText("file_too_large"), true);
    const fr = new FileReader();
    fr.onload = () => { attachment = fr.result; drawAttach(); };
    fr.readAsDataURL(f);
  });
  drawAttach();

  const close = () => overlay.remove();
  const save = h("button", { class: "btn", type: "button" }, editing ? "Save" : "Create");
  save.onclick = async () => {
    if (!trigger.value.trim()) return toast(errText("missing_trigger"), true);
    const payload = { trigger: trigger.value, message: message.value, mention: mention.checked, match: match.value, embedId: embedSel.value || null };
    if (attachment !== undefined) payload.attachment = attachment;
    save.disabled = true;
    const ok = await attempt(
      () => api(editing ? `/api/guilds/${id}/autoreplies/${existing.id}` : `/api/guilds/${id}/autoreplies`, { method: editing ? "PUT" : "POST", body: payload }),
      editing ? "Auto reply saved" : "Auto reply created");
    save.disabled = false;
    if (ok) { close(); done(); }
  };

  const overlay = h("div", { class: "overlay", onclick: (ev) => { if (ev.target === overlay) close(); } },
    h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": editing ? "Edit auto reply" : "Create auto reply" },
      h("h2", null, editing ? "Edit auto reply" : "Create auto reply"),
      h("p", { class: "muted", style: "margin-bottom:18px" }, "Configure automatic responses for specific triggers."),
      h("label", { class: "field" }, h("span", null, "Trigger *"), trigger),
      h("label", { class: "field" }, h("span", null, "Match"), match),
      h("label", { class: "field" }, h("span", null, "Message"), message),
      h("div", { class: "toggle-row" },
        h("div", null, h("div", { style: "font-weight:600" }, "Mention user"), h("div", { class: "muted small" }, "Mention the user who triggered the auto reply")),
        h("label", { class: "switch" }, mention, h("i"))),
      h("div", { class: "field" }, h("span", { style: "display:block;font-weight:600;margin-bottom:6px" }, "Attachment"), attachBox, fileInput),
      h("label", { class: "field" }, h("span", null, "Embed"), embedSel),
      h("div", { class: "actions" }, h("button", { class: "btn ghost", type: "button", onclick: close }, "Cancel"), save)));
  document.body.append(overlay);
  trigger.focus();
  overlay.addEventListener("keydown", (ev) => { if (ev.key === "Escape") close(); });
}

/* ---------- Welcome ---------- */
// A small drag-to-position widget shared by the welcome-image layout editor below.
// `pos` is mutated in place ({x,y} in real canvas pixels) as the element is dragged.
function makeDraggable(container, el, pos, scale) {
  el.style.position = "absolute";
  el.style.touchAction = "none";
  el.style.cursor = "grab";
  const apply = () => { el.style.left = (pos.x * scale) + "px"; el.style.top = (pos.y * scale) + "px"; };
  apply();
  let dragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
  el.addEventListener("pointerdown", (ev) => {
    dragging = true;
    el.setPointerCapture(ev.pointerId);
    startX = ev.clientX; startY = ev.clientY;
    origLeft = parseFloat(el.style.left) || 0; origTop = parseFloat(el.style.top) || 0;
    el.style.cursor = "grabbing";
  });
  el.addEventListener("pointermove", (ev) => {
    if (!dragging) return;
    let nl = origLeft + (ev.clientX - startX), nt = origTop + (ev.clientY - startY);
    nl = Math.max(0, Math.min(container.clientWidth - el.offsetWidth, nl));
    nt = Math.max(0, Math.min(container.clientHeight - el.offsetHeight, nt));
    el.style.left = nl + "px"; el.style.top = nt + "px";
    pos.x = Math.round(nl / scale); pos.y = Math.round(nt / scale);
  });
  const stop = (ev) => { dragging = false; el.style.cursor = "grab"; try { el.releasePointerCapture(ev.pointerId); } catch {} };
  el.addEventListener("pointerup", stop);
  el.addEventListener("pointercancel", stop);
  return { apply };
}

async function renderWelcome(body, id, d) {
  let cfg, user;
  try { [cfg, user] = await Promise.all([api(`/api/guilds/${id}/welcome`), api("/api/me")]); }
  catch (e) { return failView(e); }

  const enabled = h("input", { type: "checkbox", checked: cfg.enabled });
  const message = h("textarea", { placeholder: "Welcome {user} to {server}! 🎉", maxlength: "2000" });
  message.value = cfg.message || "";
  const chan = channelSelect(d.text, cfg.channel, "No welcome channel");
  const imageEnabled = h("input", { type: "checkbox", checked: cfg.imageEnabled });
  const bg = backgroundSlot({ hasExisting: cfg.hasBackground });

  const save = h("button", { class: "btn", type: "button" }, "Save welcome settings");
  save.onclick = async () => {
    save.disabled = true;
    const payload = { enabled: enabled.checked, message: message.value, channel: chan.value, imageEnabled: imageEnabled.checked };
    if (bg.value !== undefined) payload.background = bg.value;
    await attempt(() => api(`/api/guilds/${id}/welcome`, { method: "POST", body: payload }), "Welcome settings saved");
    save.disabled = false;
  };

  // ---- Drag-and-drop layout editor: a scaled-down live preview of the 960×320 image ----
  const SCALE = 0.85;
  const canvasW = (cfg.canvas?.w || 960) * SCALE, canvasH = (cfg.canvas?.h || 320) * SCALE;
  const avatarPx = (cfg.canvas?.avatarSize || 180) * SCALE;
  const avatarPos = { ...(cfg.avatarPos || { x: 60, y: 70 }) };
  const namePos = { ...(cfg.namePos || { x: 280, y: 100 }) };
  const subPos = { ...(cfg.subPos || { x: 280, y: 180 }) };
  const DEFAULTS = { avatarPos: { x: 60, y: 70 }, namePos: { x: 280, y: 100 }, subPos: { x: 280, y: 180 } };

  const previewBox = h("div", {
    style: `position:relative;width:${canvasW}px;height:${canvasH}px;max-width:100%;flex-shrink:0;border-radius:10px;overflow:hidden;` +
      `background:${cfg.backgroundDataUrl ? `url(${cfg.backgroundDataUrl}) center/cover` : "#0b0b0d"};border:1px solid rgba(255,255,255,.15)`,
  });
  const avatarUrl = user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128` : null;
  const avatarEl = h("div", {
    title: "Drag to reposition the avatar",
    style: `width:${avatarPx}px;height:${avatarPx}px;border-radius:50%;box-sizing:border-box;border:2px solid #fff;` +
      `background:${avatarUrl ? `url(${avatarUrl}) center/cover` : "#333"}`,
  });
  const nameEl = h("div", {
    title: "Drag to reposition the username",
    style: "white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.85)",
  });
  const subEl = h("div", {
    title: "Drag to reposition the subtitle",
    style: "white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.85)",
  });
  previewBox.append(avatarEl, nameEl, subEl);

  const avatarDrag = makeDraggable(previewBox, avatarEl, avatarPos, SCALE);
  const nameDrag = makeDraggable(previewBox, nameEl, namePos, SCALE);
  const subDrag = makeDraggable(previewBox, subEl, subPos, SCALE);

  // ---- Customizable text — {user} and {server} get swapped in for real values when the image is generated ----
  const nameTemplate = h("input", { type: "text", maxlength: "100", placeholder: "{user}" });
  nameTemplate.value = cfg.nameTemplate || "{user}";
  const subTemplate = h("input", { type: "text", maxlength: "100", placeholder: "welcome to {server}" });
  subTemplate.value = cfg.subTemplate || "welcome to {server}";

  // ---- Size, color, font — needs the canvas engine on the host to actually apply ----
  const CSS_FAMILY = { "serif-bold": "serif", "sans-serif": "sans-serif", serif: "serif", monospace: "monospace", cursive: "cursive", fantasy: "fantasy" };
  const CSS_BOLD = { "serif-bold": "700" };
  const fontChoices = cfg.fontChoices?.length ? cfg.fontChoices : [{ id: "serif-bold", label: "Bold Serif" }, { id: "sans-serif", label: "Sans Serif" }];
  const fontFamily = h("select", null, fontChoices.map((f) => h("option", { value: f.id }, f.label)));
  fontFamily.value = cfg.fontFamily || fontChoices[0].id;
  const nameColor = h("input", { type: "color", value: cfg.nameColor || "#ffffff" });
  const subColor = h("input", { type: "color", value: cfg.subColor || "#ffffff" });
  const nameSize = h("input", { type: "text", inputmode: "numeric", value: cfg.nameSize || 64 });
  const subSize = h("input", { type: "text", inputmode: "numeric", value: cfg.subSize || 32 });

  const updatePreviewText = () => {
    const previewFill = (tpl) => (tpl || "").replaceAll("{user}", user.username || "Username").replaceAll("{server}", d.name);
    nameEl.textContent = previewFill(nameTemplate.value);
    subEl.textContent = previewFill(subTemplate.value);
    const fam = CSS_FAMILY[fontFamily.value] || "sans-serif";
    const bold = CSS_BOLD[fontFamily.value] || "600";
    nameEl.style.fontFamily = fam;
    nameEl.style.fontWeight = bold;
    nameEl.style.color = nameColor.value;
    nameEl.style.fontSize = `${(Number(nameSize.value) || 64) * SCALE}px`;
    subEl.style.fontFamily = fam;
    subEl.style.fontWeight = CSS_BOLD[fontFamily.value] ? bold : "500";
    subEl.style.color = subColor.value;
    subEl.style.fontSize = `${(Number(subSize.value) || 32) * SCALE}px`;
  };
  [nameTemplate, subTemplate, fontFamily, nameColor, subColor, nameSize, subSize].forEach((el) => {
    el.addEventListener("input", updatePreviewText);
  });
  updatePreviewText();

  const saveLayout = h("button", { class: "btn sm", type: "button" }, "Save layout");
  saveLayout.onclick = async () => {
    saveLayout.disabled = true;
    await attempt(() => api(`/api/guilds/${id}/welcome`, { method: "POST", body: {
      avatarPos, namePos, subPos,
      nameTemplate: nameTemplate.value, subTemplate: subTemplate.value,
      fontFamily: fontFamily.value, nameColor: nameColor.value, subColor: subColor.value,
      nameSize: nameSize.value, subSize: subSize.value,
    } }), "Layout saved");
    saveLayout.disabled = false;
  };
  const resetLayout = h("button", { class: "btn ghost sm", type: "button" }, "Reset to default layout");
  resetLayout.onclick = () => {
    Object.assign(avatarPos, DEFAULTS.avatarPos);
    Object.assign(namePos, DEFAULTS.namePos);
    Object.assign(subPos, DEFAULTS.subPos);
    nameTemplate.value = "{user}"; subTemplate.value = "welcome to {server}";
    fontFamily.value = fontChoices[0].id; nameColor.value = "#ffffff"; subColor.value = "#ffffff";
    nameSize.value = 64; subSize.value = 32;
    avatarDrag.apply(); nameDrag.apply(); subDrag.apply(); updatePreviewText();
  };

/* ---------- Verification ---------- */
async function renderVerification(body, id, d) {
  let cfg;
  try { cfg = await api(`/api/guilds/${id}/verify`); }
  catch (e) { return failView(e); }

  const enabled = h("input", { type: "checkbox", checked: cfg.enabled });
  const message = h("textarea", { placeholder: "Click the button below to verify and unlock the rest of the server.", maxlength: "2000" });
  message.value = cfg.message || "";
  const buttonLabel = h("input", { type: "text", placeholder: "Verify", maxlength: "80" });
  buttonLabel.value = cfg.buttonLabel || "";
  const chan = channelSelect(d.text, cfg.channel, "Select a channel");
  const role = roleSelect(d.roles || [], cfg.roleId, "Select the verified role");

  const MAX_IMAGES = 4;
  let images = null; // null = keep the saved photos, otherwise this array replaces them on save
  const fileInput = h("input", { type: "file", accept: "image/png,image/jpeg,image/gif,image/webp", multiple: true, hidden: true });
  const imgBox = h("div");
  const currentCount = () => (images === null ? cfg.imageCount : images.length);
  const drawImages = () => {
    const parts = [];
    if (images) {
      parts.push(h("div", { class: "thumbs" }, images.map((im, i) =>
        h("div", { class: "thumb" },
          h("img", { src: im.dataUrl, alt: `Photo ${i + 1}` }),
          h("button", { type: "button", "aria-label": `Remove photo ${i + 1}`, onclick: () => { images.splice(i, 1); drawImages(); } }, "×")))));
    } else if (cfg.imageCount) {
      parts.push(h("div", { class: "toggle-row" }, h("span", null, `Using ${cfg.imageCount} saved image${cfg.imageCount === 1 ? "" : "s"}`),
        h("button", { class: "btn danger sm", type: "button", onclick: () => { images = []; drawImages(); } }, "Remove all")));
    }
    if (currentCount() < MAX_IMAGES) {
      parts.push(h("div", { class: "drop", tabindex: "0", role: "button", onclick: () => fileInput.click(),
        onkeydown: (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fileInput.click(); } } },
        h("strong", null, currentCount() ? "Add another photo" : "Click to upload photos"),
        h("span", { class: "muted small" }, `Up to ${MAX_IMAGES} photos · PNG, JPG, GIF or WEBP · 5MB each`)));
    }
    imgBox.replaceChildren(...parts);
  };
  fileInput.addEventListener("change", async () => {
    if (images === null) images = [];
    const picked = [...fileInput.files].slice(0, MAX_IMAGES - images.length);
    fileInput.value = "";
    for (const f of picked) {
      if (!/^image\/(png|jpe?g|gif|webp)$/.test(f.type)) { toast(errText("invalid_image"), true); continue; }
      if (f.size > 5 * 1024 * 1024) { toast(`${f.name}: ${errText("file_too_large")}`, true); continue; }
      const dataUrl = await new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(f); });
      images.push({ dataUrl, size: f.size });
    }
    drawImages();
  });
  drawImages();

  const buildPayload = () => {
    const payload = { enabled: enabled.checked, message: message.value, buttonLabel: buttonLabel.value, channel: chan.value, role: role.value };
    if (images !== null) payload.images = images.map((i) => i.dataUrl);
    return payload;
  };

  const saveOnly = h("button", { class: "btn ghost", type: "button" }, "Save settings");
  saveOnly.onclick = async () => {
    saveOnly.disabled = true;
    await attempt(() => api(`/api/guilds/${id}/verify`, { method: "POST", body: buildPayload() }), "Verification settings saved");
    saveOnly.disabled = false;
  };

  const post = h("button", { class: "btn", type: "button" }, cfg.posted ? "Update verification message" : "Post verification message");
  post.onclick = async () => {
    if (!chan.value) return toast("Pick a channel first.", true);
    if (!role.value) return toast("Pick a role first.", true);
    post.disabled = true;
    const saved = await attempt(() => api(`/api/guilds/${id}/verify`, { method: "POST", body: buildPayload() }));
    if (saved) await attempt(() => api(`/api/guilds/${id}/verify/post`, { method: "POST" }), "Verification message posted");
    post.disabled = false;
  };

  body.append(
    h("div", { class: "panel", style: "max-width:720px" },
      h("div", { class: "row between" },
        h("h2", null, "Verification"),
        h("span", { class: "chip" }, cfg.posted ? `Posted in #${cfg.channel || "?"}` : "Not posted yet")),
      h("p", { class: "muted small", style: "margin-bottom:16px" },
        "Posts a message with a button in a channel. Anyone who presses it gets the role you pick — no extra steps for them."),
      h("div", { class: "toggle-row" },
        h("div", null, h("div", { style: "font-weight:600" }, "Enabled"), h("div", { class: "muted small" }, "Turn the verify button on or off")),
        h("label", { class: "switch" }, enabled, h("i"))),
      h("label", { class: "field" }, h("span", null, "Message"), message),
      h("div", { class: "field" }, h("span", { style: "display:block;font-weight:600;margin-bottom:6px" }, "Photos"), imgBox, fileInput),
      h("div", { class: "grid-2" },
        h("label", { class: "field" }, h("span", null, "Button text"), buttonLabel),
        h("label", { class: "field" }, h("span", null, "Channel"), chan)),
      h("label", { class: "field" }, h("span", null, "Role to give on verify"), role),
      h("div", { class: "row" }, saveOnly, post)));
}

  const roleRows = roles.length

        const cb = h("input", { type: "checkbox", checked: cfg.roleIds.includes(r.id) });
        checks.set(r.id, cb);
        return h("li", null,
          h("div", { class: "grow" }, r.name),
          h("label", { class: "switch" }, cb, h("i")));
      }))
    : h("p", { class: "empty" }, "This server has no roles to whitelist yet.");

  const save = h("button", { class: "btn", type: "button" }, "Save whitelist");
  save.onclick = async () => {
    save.disabled = true;
    const roleIds = [...checks.entries()].filter(([, cb]) => cb.checked).map(([rid]) => rid);
    await attempt(() => api(`/api/guilds/${id}/whitelist`, { method: "POST", body: { roleIds } }), "Whitelist saved");
    save.disabled = false;
  };

  const dashUrl = cfg.dashboardUrl || location.origin;

  body.append(
    h("div", { class: "panel" },
      h("h2", null, "Whitelist"),
      h("p", { class: "muted small", style: "margin-bottom:16px" },
        "Pick which roles are allowed to use YAN's slash commands (like /top, /rank, /jail). Leave everything off and YAN stays open to the whole server. Server admins (Manage Server) can always use YAN's commands, whitelist or not."),
      roleRows,
      save),
    h("div", { class: "panel" },
      h("h2", null, "Dashboard link"),
      h("p", { class: "muted small", style: "margin-bottom:14px" }, "Anyone allowed to use YAN gets this link when they type /dashboard in Discord."),
      h("span", { class: "chip" }, dashUrl)));
}

/* =====================================================================
   Router
   ===================================================================== */
function route() {
  document.querySelectorAll(".overlay").forEach((o) => o.remove());
  const [pathPart, queryPart = ""] = (location.hash.slice(1) || "/login").split("?");
  const parts = pathPart.split("/").filter(Boolean);
  const query = new URLSearchParams(queryPart);
  scrollTo(0, 0);

  if (parts[0] === "login") return viewLogin(query);
  if (parts[0] === "dashboard") return viewDashboard();
  if (parts[0] === "server" && parts[1]) return viewServer(parts[1], TABS.some(([k]) => k === parts[2]) ? parts[2] : "overview");
  location.hash = "#/dashboard";
}

// Grab the real CLIENT_ID from web.js before the first render, so the "Add YAN
// to a server" button works immediately without anyone editing this file by hand.
(async () => {
  try {
    const cfg = await fetch(getApi() + "/config", { headers: { "ngrok-skip-browser-warning": "1" } }).then((r) => r.json());
    if (cfg?.clientId) CONFIG.CLIENT_ID = cfg.clientId;
  } catch {}
  addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
